<text x="860" y="218" class="small">GitHub source + credential-free CI</text>
<rect x="860" y="245" width="355" height="80" rx="10" class="local"/>
<text x="878" y="275" class="label">Scoped read-only collectors</text>
<text x="878" y="302" class="body">Metadata + management-event history</text>
<path d="M775 285H860" class="edge"/>
<text x="795" y="273" class="small">Read</text>
<path d="M1038 325V355" class="edge"/>
<rect x="860" y="355" width="355" height="100" rx="10" class="local"/>
<text x="878" y="383" class="label">Encrypted evidence + verification</text>
<text x="878" y="410" class="body">Private archives · source/timing checks</text>
<text x="878" y="436" class="small">Local evidence key protected by Keychain</text>
<path d="M1038 455V505" class="edge" stroke-dasharray="6 5"/>
<text x="860" y="487" class="small">Validated live feature release still pending</text>
<rect x="860" y="505" width="355" height="125" rx="10" class="local"/>
<text x="878" y="529" class="status" style="fill:#315f9a">OFFLINE PROTOTYPE</text>
<text x="878" y="556" class="label">Isolation Forest</text>
<text x="878" y="584" class="body">Bounded adaptation</text>
<text x="878" y="609" class="body">Deterministic compliance mapping</text>
<text x="860" y="656" class="small">No SageMaker or Bedrock service is used.</text>
<!-- Future steps do not imply approval, collected trials, or model readiness. -->
<rect x="40" y="720" width="1200" height="235" rx="18" fill="#fafbfd" stroke="#d4dce7"/>
<text x="65" y="758" class="group">Next: validated experiments and analysis</text>
<rect x="65" y="785" width="340" height="120" rx="10" class="pending"/>
<text x="83" y="815" class="label">Controlled scenario runner</text>
<text x="83" y="843" class="body">Pre-state · lock · recovery intent</text>
<text x="83" y="870" class="body">Change → observe → restore</text>
<text x="83" y="893" class="small">Safety components implemented offline</text>
<path d="M405 845H455" class="edge" stroke-dasharray="6 5"/>
<rect x="455" y="785" width="320" height="120" rx="10" class="pending"/>
<text x="473" y="815" class="label">Instrument validation + pilot</text>
