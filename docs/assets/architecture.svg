<text x="473" y="870" class="body">Shared windows · paired predictions</text>
<path d="M775 845H825" class="edge" stroke-dasharray="6 5"/>
<rect x="825" y="785" width="390" height="120" rx="10" class="pending"/>
<text x="843" y="815" class="label">Separate confirmatory study</text>
<text x="843" y="843" class="body">Frozen protocol + justified sample size</text>
<text x="843" y="870" class="body">R analysis · evidence-backed findings</text>
<text x="65" y="933" class="small">Approval required before live scenarios. Development, pilot and confirmatory evidence stay separate.</text>
<text x="40" y="994" class="body">Current boundary: no study model trained · zero pilot/confirmatory research trials</text>
<text x="40" y="1024" class="small">Deployment status summarizes retained records, not a live inventory. Reader bucket scope excludes the sandbox.</text>
